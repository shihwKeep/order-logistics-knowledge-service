x-runtime-defaults: &runtime-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  knowledge-minio:
    <<: *runtime-defaults
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 256
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${KNOWLEDGE_MINIO_ROOT_USER:?set KNOWLEDGE_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${KNOWLEDGE_MINIO_ROOT_PASSWORD:?set KNOWLEDGE_MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - knowledge-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  knowledge-rabbitmq:
    <<: *runtime-defaults
    image: rabbitmq:4.1-management
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 512
    environment:
      RABBITMQ_DEFAULT_USER: ${KNOWLEDGE_RABBITMQ_USERNAME:-knowledge}
      RABBITMQ_DEFAULT_PASS: ${KNOWLEDGE_RABBITMQ_PASSWORD:?set KNOWLEDGE_RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - knowledge-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  knowledge-ocr:
    <<: *runtime-defaults
    build:
      context: ./ocr-service
    cpus: "2.0"
    mem_limit: 3g
    pids_limit: 512
    environment:
      OCR_MAX_IMAGE_BYTES: 20971520
      OCR_MAX_IMAGE_PIXELS: 40000000
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')"]
      interval: 20s
      timeout: 5s
      retries: 20

  knowledge-elasticsearch:
    <<: *runtime-defaults
    build:
      context: ./infra/elasticsearch
      args:
        ELASTIC_VERSION: 8.15.3
    image: order-logistics-elasticsearch-ik:8.15.3
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 512
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${KNOWLEDGE_ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - knowledge-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30

  knowledge-milvus-etcd:
    <<: *runtime-defaults
    image: quay.io/coreos/etcd:v3.5.18
    cpus: "0.5"
    mem_limit: 512m
    pids_limit: 256
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd --advertise-client-urls=http://127.0.0.1:2379 --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - knowledge-milvus-etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20

  knowledge-milvus-minio:
    <<: *runtime-defaults
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 256
    command: minio server /minio_data
    environment:
      MINIO_ROOT_USER: ${KNOWLEDGE_MILVUS_MINIO_USER:?set KNOWLEDGE_MILVUS_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${KNOWLEDGE_MILVUS_MINIO_PASSWORD:?set KNOWLEDGE_MILVUS_MINIO_PASSWORD}
    volumes:
      - knowledge-milvus-minio-data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  knowledge-milvus:
    <<: *runtime-defaults
    image: milvusdb/milvus:v2.6.4
    cpus: "2.0"
    mem_limit: 4g
    pids_limit: 1024
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: knowledge-milvus-etcd:2379
      MINIO_ADDRESS: knowledge-milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${KNOWLEDGE_MILVUS_MINIO_USER:?set KNOWLEDGE_MILVUS_MINIO_USER}
      MINIO_SECRET_ACCESS_KEY: ${KNOWLEDGE_MILVUS_MINIO_PASSWORD:?set KNOWLEDGE_MILVUS_MINIO_PASSWORD}
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - knowledge-milvus-data:/var/lib/milvus
    depends_on:
      knowledge-milvus-etcd:
        condition: service_healthy
      knowledge-milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 30

volumes:
  knowledge-minio-data:
  knowledge-rabbitmq-data:
  knowledge-elasticsearch-data:
  knowledge-milvus-etcd-data:
  knowledge-milvus-minio-data:
  knowledge-milvus-data:
