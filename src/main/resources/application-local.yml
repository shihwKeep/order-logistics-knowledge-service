spring:
  datasource:
    url: ${KNOWLEDGE_DB_URL:jdbc:mysql://127.0.0.1:3307/order_logistics_knowledge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${KNOWLEDGE_DB_USERNAME:root}
    password: ${KNOWLEDGE_DB_PASSWORD:root}
  data:
    redis:
      host: ${KNOWLEDGE_REDIS_HOST:127.0.0.1}
      port: ${KNOWLEDGE_REDIS_PORT:6380}
  rabbitmq:
    host: ${KNOWLEDGE_RABBITMQ_HOST:127.0.0.1}
    port: ${KNOWLEDGE_RABBITMQ_PORT:5672}
    username: ${KNOWLEDGE_RABBITMQ_USERNAME:knowledge}
    password: ${KNOWLEDGE_RABBITMQ_PASSWORD}
    virtual-host: ${KNOWLEDGE_RABBITMQ_VHOST:/}

knowledge:
  user-memory:
    enabled: true
  sspx:
    base-url: ${SSPX_BASE_URL:http://127.0.0.1:9092}
    client-id: ${SSPX_CLIENT_ID:100006}
    client-secret: ${SSPX_CLIENT_SECRET}
    application-id: ${SSPX_APPLICATION_ID:444}
    connect-timeout: 2s
    read-timeout: 4s
  admin-session:
    cookie-name: KB_ADMIN_SESSION
    idle-timeout: 8h
    absolute-timeout: 8h
    role-cache-ttl: 5m
    touch-interval: 1m
    secure-cookie: ${KNOWLEDGE_SECURE_COOKIE:false}
  document:
    storage:
      enabled: ${KNOWLEDGE_MINIO_ENABLED:true}
      endpoint: ${KNOWLEDGE_MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${KNOWLEDGE_MINIO_ACCESS_KEY:${KNOWLEDGE_MINIO_ROOT_USER}}
      secret-key: ${KNOWLEDGE_MINIO_SECRET_KEY:${KNOWLEDGE_MINIO_ROOT_PASSWORD}}
      bucket: ${KNOWLEDGE_MINIO_BUCKET:knowledge-documents}
      max-file-size: 100MB
    ocr:
      base-url: ${KNOWLEDGE_OCR_BASE_URL:http://127.0.0.1:8091}
      connect-timeout: 2s
      read-timeout: 30s
      max-response-bytes: 2097152
      low-confidence-threshold: 0.80
    parsing:
      max-pages: 500
      max-slides: 500
      max-sheets: 100
      max-rows-per-sheet: 100000
    chunking:
      target-tokens: 500
      max-tokens: 800
      overlap-tokens: 80
    ingestion:
      enabled: ${KNOWLEDGE_INGESTION_ENABLED:true}
      worker-id: ${KNOWLEDGE_WORKER_ID:knowledge-local}
      lease-duration: 60s
      retry-base-delay: 10s
      max-retries: 5
      scan-batch-size: 20
      max-concurrent-tasks: 1
      scan-delay: 5s
      outbox-delay: 2s
      exchange: knowledge.document
      routing-key: ingestion.wakeup
      queue: knowledge.document.ingestion
  retrieval:
    internal-api:
      enabled: ${KNOWLEDGE_INTERNAL_API_ENABLED:true}
      secret: ${KNOWLEDGE_INTERNAL_API_SECRET}
      allowed-clock-skew: 5m
      nonce-ttl: 10m
    embedding:
      model: qwen3.7-text-embedding
      dimension: 2560
      batch-size: 20
      instruction-version: qwen37-customer-service-v2
    elasticsearch:
      base-url: ${KNOWLEDGE_ELASTICSEARCH_BASE_URL:http://127.0.0.1:9200}
      username: ${KNOWLEDGE_ELASTICSEARCH_USERNAME:}
      password: ${KNOWLEDGE_ELASTICSEARCH_PASSWORD:}
      draft-index: knowledge_chunks_draft_v2
      published-index: knowledge_chunks_published_v2
      connect-timeout: 2s
      read-timeout: 5s
      verification-limit: 10000
    milvus:
      enabled: ${KNOWLEDGE_MILVUS_ENABLED:true}
      uri: ${KNOWLEDGE_MILVUS_URI:http://127.0.0.1:19530}
      database-name: ${KNOWLEDGE_MILVUS_DATABASE:default}
      token: ${KNOWLEDGE_MILVUS_TOKEN:}
      draft-collection: knowledge_chunks_draft_v2
      published-collection: knowledge_chunks_published_v2
      dimension: 2560
      connect-timeout: 5s
      request-timeout: 10s
      verification-limit: 10000
    reranker:
      enabled: ${KNOWLEDGE_RERANKER_ENABLED:true}
      top-k: 5
      score-threshold: 0.15
    strategy:
      recall-top-k: 30
      fusion-top-k: 10
      final-top-k: 5
      vector-weight: 1.0
      keyword-weight: 1.0
      version: qwen37-es-milvus-rrf60-rerank-v3
    publication-cleanup:
      enabled: true
      batch-size: 20
      scan-delay: 5s
